name: Deploy to Cloudflare

on:
  push:
    branches: ['claude/retreat-registration-portal-Ay4Iv', 'main']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create D1 Database (idempotent)
        run: |
          OUTPUT=$(npx wrangler d1 create custodi-parvulos-db 2>&1 || true)
          echo "$OUTPUT"
          DB_ID=$(echo "$OUTPUT" | grep -oP 'database_id\s*=\s*"\K[^"]+' || true)
          if [ -z "$DB_ID" ]; then
            DB_ID=$(npx wrangler d1 list --json 2>/dev/null | jq -r '.[] | select(.name=="custodi-parvulos-db") | .uuid' || true)
          fi
          echo "DB_ID=$DB_ID" >> $GITHUB_ENV
          echo "::notice::D1 Database ID: $DB_ID"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Create KV Namespace (idempotent)
        run: |
          OUTPUT=$(npx wrangler kv namespace create SESSIONS 2>&1 || true)
          echo "$OUTPUT"
          # Try to extract from create output
          KV_ID=$(echo "$OUTPUT" | grep -oP 'id\s*=\s*"\K[^"]+' || true)
          # If empty, try listing existing namespaces
          if [ -z "$KV_ID" ]; then
            LIST=$(npx wrangler kv namespace list 2>/dev/null || true)
            echo "KV list: $LIST"
            KV_ID=$(echo "$LIST" | jq -r '.[] | select(.title | test("SESSIONS")) | .id' 2>/dev/null || true)
          fi
          # Last resort — parse from "already exists" error which sometimes includes the id
          if [ -z "$KV_ID" ]; then
            KV_ID=$(echo "$OUTPUT" | grep -oP '[0-9a-f]{32}' | head -1 || true)
          fi
          echo "KV_ID=$KV_ID" >> $GITHUB_ENV
          echo "::notice::KV Namespace ID: $KV_ID"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Patch wrangler.toml with resource IDs
        run: |
          sed -i "s/DB_ID_PLACEHOLDER/$DB_ID/" wrangler.toml
          sed -i "s/KV_ID_PLACEHOLDER/$KV_ID/" wrangler.toml
          echo "=== wrangler.toml ==="
          cat wrangler.toml
          # Verify no placeholders remain
          if grep -q "PLACEHOLDER" wrangler.toml; then
            echo "::error::wrangler.toml still has placeholders!"
            exit 1
          fi

      - name: Run D1 Migrations
        run: npx wrangler d1 migrations apply custodi-parvulos-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build Frontend
        run: npm run build

      - name: Deploy Worker + Assets
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
