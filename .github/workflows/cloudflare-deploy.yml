name: Deploy to Cloudflare

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'What to do'
        required: true
        default: 'deploy'
        type: choice
        options:
          - create-db
          - migrate
          - deploy
          - full-setup

permissions:
  contents: read

jobs:
  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create D1 Database
        if: inputs.action == 'create-db' || inputs.action == 'full-setup'
        run: |
          OUTPUT=$(npx wrangler d1 create custodi-parvulos-db 2>&1 || true)
          echo "$OUTPUT"
          DB_ID=$(echo "$OUTPUT" | grep -oP 'database_id\s*=\s*"\K[^"]+' || true)
          if [ -n "$DB_ID" ]; then
            echo "DB_ID=$DB_ID" >> $GITHUB_ENV
            echo "::notice::D1 Database created with ID: $DB_ID"
          else
            echo "::notice::Database may already exist. Check output above."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Run D1 Migrations
        if: inputs.action == 'migrate' || inputs.action == 'full-setup' || inputs.action == 'deploy'
        run: npx wrangler d1 migrations apply custodi-parvulos-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build Frontend
        if: inputs.action == 'deploy' || inputs.action == 'full-setup'
        run: npm run build

      - name: Deploy Worker + Assets
        if: inputs.action == 'deploy' || inputs.action == 'full-setup'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
