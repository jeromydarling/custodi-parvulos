name: Deploy to Cloudflare

on:
  push:
    branches: ['claude/retreat-registration-portal-Ay4Iv', 'main']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create D1 Database (idempotent)
        run: |
          OUTPUT=$(npx wrangler d1 create custodi-parvulos-db 2>&1 || true)
          echo "$OUTPUT"
          # Extract DB ID if newly created
          DB_ID=$(echo "$OUTPUT" | grep -oP 'database_id\s*=\s*"\K[^"]+' || true)
          if [ -z "$DB_ID" ]; then
            # Already exists — get ID from list
            DB_ID=$(npx wrangler d1 list --json 2>/dev/null | jq -r '.[] | select(.name=="custodi-parvulos-db") | .uuid' || true)
          fi
          echo "DB_ID=$DB_ID" >> $GITHUB_ENV
          echo "Database ID: $DB_ID"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Update wrangler.toml with DB ID
        run: |
          if [ -n "$DB_ID" ]; then
            sed -i "s/database_id = \".*\"/database_id = \"$DB_ID\"/" wrangler.toml
            echo "Updated wrangler.toml with database_id: $DB_ID"
            cat wrangler.toml
          fi

      - name: Run D1 Migrations
        run: npx wrangler d1 migrations apply custodi-parvulos-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build Frontend
        run: npm run build

      - name: Deploy Worker + Assets
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
