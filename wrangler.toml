name = "custodi-parvulos-api"
main = "api/worker.js"
compatibility_date = "2024-12-01"

[vars]
ENVIRONMENT = "production"

[[d1_databases]]
binding = "DB"
database_name = "custodi-parvulos-db"
database_id = "" # Fill after running: npx wrangler d1 create custodi-parvulos-db
migrations_dir = "api/migrations"

[site]
bucket = "./dist"
