name = "custodi-parvulos"
main = "api/worker.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
assets = { directory = "./dist" }

[[d1_databases]]
binding = "DB"
database_name = "custodi-parvulos-db"
database_id = "DB_ID_PLACEHOLDER"
migrations_dir = "api/migrations"

[[kv_namespaces]]
binding = "SESSIONS"
id = "KV_ID_PLACEHOLDER"
